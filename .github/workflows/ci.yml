name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q app desktop tests

  windows-sidecar-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Windows timezone database
        run: python -c "from zoneinfo import ZoneInfo; print(ZoneInfo('Europe/London'))"
      - name: Import Windows sidecar
        run: python -c "import desktop.windows_sidecar; print('Windows sidecar import OK')"
      - name: Parse PowerShell launch scripts
        shell: powershell
        run: |
          [void][scriptblock]::Create((Get-Content -Raw windows/start_life_os.ps1))
          [void][scriptblock]::Create((Get-Content -Raw windows/stop_life_os.ps1))
          [void][scriptblock]::Create((Get-Content -Raw windows/install_shortcut.ps1))
          [void][scriptblock]::Create((Get-Content -Raw windows/doctor.ps1))
